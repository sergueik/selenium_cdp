<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" href="favicon.png">
<title>Ultra Basic Mermaid Renderer</title>

<script src="https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js">
</script>
<script src=".https://cdn.jsdelivr.net/gh/sharonchoong/svg-exportJS@master/dist/umd/svg-export.umd.standalone.min.js"></script>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: Verdana, sans-serif;
  background: linear-gradient(#7d8086, #5d6168);
  color: #111;
}

body {
  padding: 6px;
  box-sizing: border-box;
}

.app-shell {
  width: 100%;
  height: calc(100vh - 12px);
  background: linear-gradient(#c8c8c8,#a9a9a9);
  border: 2px solid #6d6d6d;
  box-shadow:
      inset 1px 1px 0 #f5f5f5,
      inset -1px -1px 0 #6e6e6e,
      0 4px 12px rgba(0,0,0,0.35);
  padding: 8px;
  box-sizing: border-box;
}

.titlebar {
  background: linear-gradient(#d8d8d8,#a8a8a8);
  border: 1px solid #777;
  padding: 6px 10px;
  margin-bottom: 8px;
  font-weight: bold;
}

.split {
  display: flex;
  gap: 8px;
  height: calc(100% - 42px);
}

.pane-input {
  flex: 0 0 25%;
  display: flex;
  flex-direction: column;
  min-width: 220px;
}

.pane-output {
  flex: 0 0 75%;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.panel-label {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 4px;
}

textarea {
  width: 100%;
  flex: 1;
  box-sizing: border-box;
  background: #efefef;
  border: 2px inset #999;
  font-family: Consolas, monospace;
  padding: 8px;
  resize: vertical;
}

#output {
  flex: 1;
  overflow: auto;
  background: #f5f5f5;
  border: 2px inset #999;
  padding: 6px;
}

button {
  padding: 6px 12px;
  margin-right: 4px;
  border: 1px solid #666;
  background: linear-gradient(#eeeeee,#bbbbbb);
  cursor: pointer;
  font-weight: bold;
}
</style>

<script>

mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'loose'
});

let scale = 1;

window.zoomIn = function() {
    scale += 0.1;
    applyZoom();
};

window.zoomOut = function() {
    scale = Math.max(0.2, scale - 0.1);
    applyZoom();
};

window.applyZoom = function() {

    const svg = document.querySelector('#output svg');

    if (svg) {
        svg.style.transform = 'scale(' + scale + ')';
        svg.style.transformOrigin = '0 0';
    }
};

function normalizeMermaidSource(source) {

    source = source.trim();

    // Repeatedly peel an outer Markdown fence.
    for (;;) {

        const outer = source.match(
            /^(`{3,})[^\r\n]*\r?\n([\s\S]*?)\r?\n\1/
        );

        if (!outer) {
            break;
        }

        source = outer[2].trim();
    }

    return source;
}

window.renderMermaid = function() {

    const source = normalizeMermaidSource(
        document.getElementById('diagramInput').value
    );

    const output = document.getElementById('output');

    try {

        mermaid.mermaidAPI.render( 'graph1' + Math.floor(Date.now() / 1000), source,
            function(svgCode) {

                output.innerHTML = svgCode;

                const svg = output.querySelector('svg');

                console.log(
                    'Mermaid callback raw viewBox:',
                    svg.getAttribute('viewBox')
                );

                console.dir({
                    x: svg.viewBox.baseVal.x,
                    y: svg.viewBox.baseVal.y,
                    width: svg.viewBox.baseVal.width,
                    height: svg.viewBox.baseVal.height
                });

                console.log( 'Mermaid SVG:', svg.outerHTML.substring(0, 300));

                applyZoom();
            }
        );

    } catch (e) {

        console.log( 'renderMermaid exception: ' + String(e));

        output.innerHTML = '<pre>' + String(e) + '</pre>';
    }

};

/*
 * Create an export copy of the Mermaid SVG and create inline styles for the computed presentation properties on the SVG elements.
 */
function prepareSvgForExport(sourceSvg) {

    var data = sourceSvg.outerHTML;

    console.log( 'prepareSvgForExport original source length:', data.length);

    console.log( 'prepareSvgForExport original source fragment:', data.substring(0, 200));

    const svg = sourceSvg.cloneNode(true);

    data = svg.outerHTML;

    console.log( 'prepareSvgForExport clone source length:', data.length);

    console.log( 'prepareSvgForExport clone source fragment:', data.substring(0, 200));

    console.log( 'prepareSvgForExport clone source SVG metadata:');

    console.dir({
        width: svg.getAttribute('width'),
        height: svg.getAttribute('height'),
        viewBox: svg.getAttribute('viewBox'),
        xmlns: svg.getAttribute('xmlns')
    });

    const viewBox = svg.viewBox.baseVal;

    console.log( 'prepareSvgForExport clone viewBox:');

    console.dir( viewBox, { depth: null });

    console.log( 'prepareSvgForExport MERMAID SVG:');

    console.dir({
        viewBox: svg.getAttribute('viewBox'),
        width: svg.getAttribute('width'),
        height: svg.getAttribute('height'),
        clientWidth: svg.clientWidth,
        clientHeight: svg.clientHeight
    });

    if (viewBox && viewBox.width > 0 && viewBox.height > 0) {

        svg.setAttribute( 'width', viewBox.width);

        svg.setAttribute( 'height', viewBox.height);

        svg.style.width = viewBox.width + 'px';

        svg.style.height = viewBox.height + 'px';

        svg.style.maxWidth = 'none';

        svg.style.transform = 'none';
    }

    /*
     * The browser's computed style is available for the original
     * Mermaid SVG. Copy the important SVG presentation properties
     * onto the corresponding cloned elements.
     */
    const sourceElements = sourceSvg.querySelectorAll('*');

    const targetElements = svg.querySelectorAll('*');

    const properties = [
        'fill',
        'fill-opacity',
        'stroke',
        'stroke-width',
        'stroke-opacity',
        'stroke-dasharray',
        'stroke-dashoffset',
        'stroke-linecap',
        'stroke-linejoin',
        'opacity',
        'font-family',
        'font-size',
        'font-weight',
        'font-style',
        'text-anchor',
        'dominant-baseline'
    ];

    for (let i = 0; i < sourceElements.length; i++) {

        const source = sourceElements[i];

        const target = targetElements[i];

        if (!target) {
            continue;
        }

        const computed = window.getComputedStyle(source);

        for (const property of properties) {
            const value = computed.getPropertyValue(property);
            if (value) {
                target.style.setProperty( property, value);
            }
        }
    }

    /*
     * Remove Mermaid's embedded CSS after the important computed
     * properties have been copied to the individual elements.
     *
     * This makes the export SVG considerably less dependent on
     * CSS selector processing by the downstream converter.
     */
    const styles =
        svg.querySelectorAll('style');

    for (const style of styles) {
        style.parentNode.removeChild(style);
    }

    /*
     * Mermaid uses foreignObject for labels.
     *
     * svg-to-pdfkit/canvg may not render these reliably.
     *
     * Convert simple Mermaid labels to ordinary SVG <text>.
     */
    const foreignObjects = svg.querySelectorAll('foreignObject');

    for (const foreignObject of foreignObjects) {

        const sourceForeignObject =
            sourceSvg.querySelectorAll('foreignObject')[
                Array.prototype.indexOf.call(
                    foreignObjects,
                    foreignObject
                )
            ];

        let textContent = '';

        if (sourceForeignObject) {

            textContent =
                sourceForeignObject.textContent.trim();

        } else {

            textContent =
                foreignObject.textContent.trim();
        }

        if (!textContent) {
            continue;
        }

        const parent =
            foreignObject.parentNode;

        /*
         * The surrounding <g class='label'> normally has a
         * translate(...) transform. Preserve that group and
         * place a simple SVG text element where the foreignObject
         * used to be.
         */
        const text =
            document.createElementNS(
                'http://www.w3.org/2000/svg',
                'text'
            );

        text.textContent =
            textContent;

        const computed =
            window.getComputedStyle(
                sourceForeignObject ||
                foreignObject
            );

        text.setAttribute(
            'font-family',
            computed.fontFamily || 'Arial'
        );

        text.setAttribute(
            'font-size',
            computed.fontSize || '16px'
        );

        text.setAttribute(
            'fill',
            computed.color || '#333'
        );

        text.setAttribute(
            'text-anchor',
            'middle'
        );

        /*
         * Mermaid's foreignObject starts at x/y = 0 inside
         * the label group. Center the replacement text.
         */
        const width =
            parseFloat(
                foreignObject.getAttribute('width')
            ) || 0;

        const height =
            parseFloat(
                foreignObject.getAttribute('height')
            ) || 19;

        text.setAttribute(
            'x',
            width / 2
        );

        text.setAttribute(
            'y',
            height * 0.75
        );

        parent.replaceChild(
            text,
            foreignObject
        );
    }

    return svg;
}

/*
 * Round SVG viewBox coordinates and dimensions to integers.
 */
function normalizeSvgViewBoxToIntegers(svg) {

    const viewBox = svg.viewBox.baseVal;

    const original = svg.getAttribute('viewBox');

    const x = Math.round(viewBox.x);

    const y = Math.round(viewBox.y);

    const width = Math.round(viewBox.width);

    const height = Math.round(viewBox.height);

    const normalized = x + ' ' + y + ' ' + width + ' ' + height;

    console.log( '  original:' + original +  '  normalized:' + normalized);

    svg.setAttribute( 'viewBox', normalized);
}

window.exportSvg = async function() {

    const sourceSvg =
        document.querySelector('#output svg');

    if (!sourceSvg) {

        alert( 'No Mermaid SVG is currently rendered.');

        return;
    }

    const data = sourceSvg.outerHTML;

    console.log( 'exportSvg source length:', data.length);

    console.log( 'exportSvg source fragment:', data.substring(0, 200));

    const svg = prepareSvgForExport(sourceSvg);
    console.log( 'BEFORE viewBox normalization');

    console.log( 'attribute:', svg.getAttribute('viewBox'));

    console.dir({ x: svg.viewBox.baseVal.x, y: svg.viewBox.baseVal.y, width: svg.viewBox.baseVal.width, height: svg.viewBox.baseVal.height });

    console.log( 'outerHTML:', svg.outerHTML.substring(0, 500));

    /*
     * Diagnostic experiment:
     *
     * Remove fractional viewBox coordinates before giving
     * the SVG to the exporter.
     */
    normalizeSvgViewBoxToIntegers(svg);

    console.log( 'AFTER viewBox normalization');

    console.log( 'attribute:', svg.getAttribute('viewBox'));

    console.dir({ x: svg.viewBox.baseVal.x, y: svg.viewBox.baseVal.y, width: svg.viewBox.baseVal.width, height: svg.viewBox.baseVal.height });

    console.log( 'outerHTML:', svg.outerHTML.substring(0, 500));

    await svgExport.downloadSvg(
        svg,
        'Mermaid diagram'
    );
};

window.exportPng = async function() {

    const sourceSvg =
        document.querySelector('#output svg');

    if (!sourceSvg) {

        alert(
            'No Mermaid SVG is currently rendered.'
        );

        return;
    }

    const svg =
        prepareSvgForExport(sourceSvg);

    /*
     * Keep PNG behavior consistent with SVG export for now.
     */
    normalizeSvgViewBoxToIntegers(svg);

    await svgExport.downloadPng(
        svg,
        'Mermaid diagram'
    );
};

window.onload = renderMermaid;

</script>

</head>

<body>

<div class="app-shell">

<div class="titlebar">
Ultra Basic Mermaid Renderer
</div>

<div class="split">

<div class="pane-input">

<div class="panel-label">
Mermaid Input
</div>

<textarea id="diagramInput">

flowchart LR

A[A]
B[B]
C[C]
D[D]
A --> B
A --> C
C --> D
B --> D

</textarea>

<div style="margin-top:6px">

<button onclick="renderMermaid()">Render</button>

<button onclick="zoomIn()">+</button>

<button onclick="zoomOut()">-</button>

    <button onclick="exportSvg()"><span style="font-size: 0.67rem;">SVG<span/></button>
    
    <button onclick="exportPng()"><span style="font-size: 0.67rem;">PNG<span/></button>
    

</div>

</div>

<div class="pane-output">

<div class="panel-label">
Rendered Diagram
</div>

<div id="output"></div>

</div>

</div>

</div>

</body>
</html>
